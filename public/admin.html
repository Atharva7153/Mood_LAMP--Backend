<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mood Lamp Admin</title>
</head>
<body>
  <h1>Mood Lamp — Admin</h1>

  <div>
    <label>Backend URL: <input id="backendUrl" value="https://mood-lamp-backend.vercel.app" size="40"/></label>
    <button id="refresh">Refresh</button>
  </div>

  <h2>Add Mood</h2>
  <form id="addMoodForm">
    <label>Name: <input id="moodName" required/></label><br>
    <label>Single RGB: <input id="singleR" placeholder="r" size="3"> <input id="singleG" placeholder="g" size="3"> <input id="singleB" placeholder="b" size="3"></label><br>
    <label>Multi colors:</label><br>
    <div id="multiColorsContainer"></div>
    <button type="button" id="addColorBtn">Add Color</button>
    <br>
    <button type="submit">Add Mood</button>
  </form>

  <h2>Existing Moods</h2>
  <div id="moodList"></div>

  <div id="status"></div>

  <script>
  function getBackend() { return document.getElementById('backendUrl').value.trim(); }

  async function fetchMoods() {
    const url = getBackend() + '/moods';
    try {
      const res = await fetch(url);
      const moods = await res.json();
      renderMoods(moods);
    } catch (err) {
      document.getElementById('moodList').innerText = 'Failed to load moods: ' + err;
    }
  }

  function createColorLabel(c) {
    if (!c || typeof c !== 'object') return 'rgb(0, 0, 0)';
    const r = (typeof c.r === 'number') ? c.r : 0;
    const g = (typeof c.g === 'number') ? c.g : 0;
    const b = (typeof c.b === 'number') ? c.b : 0;
    return `rgb(${r}, ${g}, ${b})`;
  }

  function renderMoods(moods) {
    const container = document.getElementById('moodList');
    container.innerHTML = '';
    moods.forEach(m => {
      const div = document.createElement('div');
      div.style.margin = '8px 0';
      const title = document.createElement('strong');
      title.innerText = m.name + ' ';
      div.appendChild(title);

      const single = document.createElement('span');
      single.innerText = createColorLabel(m.singleColor);
      single.style.marginRight = '8px';
      div.appendChild(single);

      const del = document.createElement('button');
      del.innerText = 'Delete';
      del.onclick = async () => {
        if (!confirm('Delete mood ' + m.name + '?')) return;
        try {
          await fetch(getBackend() + '/moods/' + m._id, { method: 'DELETE' });
          fetchMoods();
        } catch (err) { alert('Delete failed: ' + err); }
      };
      div.appendChild(del);

      container.appendChild(div);
    });
  }

  function addMultiColorInput(value) {
    const container = document.getElementById('multiColorsContainer');
    const wrapper = document.createElement('div');
    wrapper.style.margin = '4px 0';
    const input = document.createElement('input');
    input.placeholder = 'r,g,b';
    input.size = 12;
    input.value = value || '';
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.innerText = 'Remove';
    remove.onclick = () => wrapper.remove();
    wrapper.appendChild(input);
    wrapper.appendChild(remove);
    container.appendChild(wrapper);
  }

  document.getElementById('addColorBtn').onclick = () => addMultiColorInput('');
  addMultiColorInput('255,170,90');
  addMultiColorInput('255,130,70');
  addMultiColorInput('255,210,150');

  document.getElementById('addMoodForm').onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById('moodName').value.trim();
    const single = {
      r: Number(document.getElementById('singleR').value) || 0,
      g: Number(document.getElementById('singleG').value) || 0,
      b: Number(document.getElementById('singleB').value) || 0
    };
    const multiInputs = document.querySelectorAll('#multiColorsContainer input');
    const parse = (s) => {
      const parts = s.split(',').map(x => Number(x.trim()) || 0);
      return { r: parts[0]||0, g: parts[1]||0, b: parts[2]||0 };
    };
    const multi = Array.from(multiInputs).map(i => parse(i.value));

    const payload = { name, singleColor: single, multiColors: multi };
    try {
      const res = await fetch(getBackend() + '/moods', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Add failed');
      document.getElementById('status').innerText = 'Added';
      fetchMoods();
    } catch (err) {
      alert('Failed to add mood: ' + err);
    }
  };

  document.getElementById('refresh').onclick = fetchMoods;
  fetchMoods();
  </script>
</body>
</html>
